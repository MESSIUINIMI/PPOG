name: ProxyIP Optimizer

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxyip-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_COUNTRIES: ${{ vars.TARGET_COUNTRIES || 'TW,SG,JP,US,KR,GB,DE,FR,AU,BR,IN,NL,TH,CA,TR,ZA,AE' }}
      COUNTRY_MATCH_MODE: ${{ vars.COUNTRY_MATCH_MODE || 'both' }}
      OUTPUT_FORMAT: ${{ vars.OUTPUT_FORMAT || 'ipport-country' }}
      MAX_CANDIDATES: ${{ vars.MAX_CANDIDATES || '300' }}
      MAX_WORKERS: ${{ vars.MAX_WORKERS || '10' }}
      CONNECT_TIMEOUT: ${{ vars.CONNECT_TIMEOUT || '5' }}
      SOURCES_FILE: config/sources.txt
      RESULTS_DIR: results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run collector, validator and country filter
        run: python -m src.optimizer

      - name: Commit result files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes; skipping commit."
          else
            git commit -m "Update verified ProxyIP results"
            git push
          fi
